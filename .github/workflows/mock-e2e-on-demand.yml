name: mock-e2e-on-demand

on:
  issue_comment:
    types: [created]
  # ❌ REMOVED: pull_request trigger
  # ❌ REMOVED: workflow_dispatch (optional)

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  # ❌ REMOVED: e2e-required-until-slash-command job entirely

  e2e-on-demand:
    name: e2e-on-demand
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/runtests') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Get PR head SHA
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.issue.number;
            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('pull_number', pull_number.toString());

      - name: Mark E2E check as in progress
        id: start_check
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const head_sha = process.env.HEAD_SHA;
            const result = await github.rest.checks.create({
              owner,
              repo,
              name: 'e2e-on-demand',
              head_sha,
              status: 'in_progress',
              details_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              output: {
                title: 'E2E started',
                summary: 'Triggered by /runtests comment'
              }
            });
            core.setOutput('check_run_id', result.data.id.toString());

      - name: Run E2E tests
        id: run_tests
        run: |
          echo "Running E2E tests..."
          # Your actual test commands here

      - name: Mark E2E check as completed
        if: always() && steps.start_check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const conclusion = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: Number('${{ steps.start_check.outputs.check_run_id }}'),
              status: 'completed',
              conclusion: conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: `E2E ${conclusion}`,
                summary: `Tests finished with status: ${conclusion}`
              }
            });

      - name: Comment result on PR
        if: always() && steps.start_check.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PULL_NUMBER: ${{ steps.pr.outputs.pull_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PULL_NUMBER);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const conclusion = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const body = [
              conclusion === 'success' ? '✅ E2E tests passed!' : '❌ E2E tests failed!',
              `Workflow run: [View run](${runUrl})`
            ].join('\n');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body
            });
